<!DOCTYPE html>
<!-- Листинги 5.5, 5.20, 5.22: шаблон в папке приложения, внешняя таблица стилей и изображение.
     th:href="@{...}" / th:src="@{...}" — аналог {% static '...' %} в Django. -->
<html lang="ru" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Привет Spring!</title>
    <link th:href="@{/css/styles.css}" rel="stylesheet">
</head>
<body>
    <h1>Домашняя страница Spring!</h1>
    <h2>templates/firstapp/home.html</h2>
    <img th:src="@{/images/image1.jpg}" alt="Море и яхта">
</body>
</html>
