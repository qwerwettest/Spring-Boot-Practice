<!DOCTYPE html>
<!-- Листинг 5.33: главная страница на основе базового шаблона.
     Аналог:
       {% extends "firstapp/base.html" %}
       {% block title %}Index{% endblock title %}
       {% block header %}Главная страница{% endblock header %}
       {% block content %}Связка шаблонов index.html и base.html{% endblock content %}
     Вся страница заменяется на base.html, а свои <title>, <h1> и <section> передаёт в него. -->
<html lang="ru" xmlns:th="http://www.thymeleaf.org"
      th:replace="~{firstapp/base :: layout(~{::title}, ~{::h1}, ~{::section})}">
<head>
    <title>Index</title>
</head>
<body>
    <h1>Главная страница</h1>
    <section>Связка шаблонов index.html и base.html</section>
</body>
</html>
