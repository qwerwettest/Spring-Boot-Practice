<!DOCTYPE html>
<!-- Листинги 5.16–5.18: встроенные и внутренние стили и их приоритет -->
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Стили</title>
    <!-- Это внутренний стиль: все h1 зелёные -->
    <style>h1 {color: green;}</style>
</head>
<body>
    <h1>Заголовок с внутренним стилем — зелёный</h1>

    <!-- Это встроенный стиль: атрибут style у самого элемента.
         Встроенный стиль имеет приоритет над внутренним, поэтому заголовок красный. -->
    <h1 style="color: red;">Заголовок со встроенным стилем — красный</h1>

    <h2 style="color: blue; font-size: 12px;">templates/firstapp/styles.html</h2>
</body>
</html>
